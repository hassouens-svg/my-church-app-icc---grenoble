# Vérifications automatiques à chaque envoi sur GitHub
name: Vérifications

on:
  push:
  pull_request:

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -q

  frontend:
    name: Compilation frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && npm run build

  docker:
    name: Image de mise en ligne (Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t icc-grenoble .
      - name: Démarrer l'image et vérifier le site + l'API
        run: |
          docker run -d -p 8000:8000 -e PORT=8000 -e SECRET_KEY=test --name app icc-grenoble
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          curl -sf localhost:8000/familles | grep -q '<div id="root">'
          curl -sf localhost:8000/api/meta | grep -q evangelisation
          curl -sf -X POST localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | grep -q token
          docker logs app
